# Runs the whole app locally: Ollama (the model), the API, and the web UI.
#
#   docker compose up --build
#
# Then open http://localhost:8080
# The first start downloads the model (about 4.7 GB) into the "ollama" volume.

services:
  ollama:
    image: ollama/ollama
    volumes:
      # Set OLLAMA_DATA to a folder (for example your existing ~/.ollama) to reuse models you already have.
      - ${OLLAMA_DATA:-ollama}:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  # Downloads the model once, then exits.
  model:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    # Skips the download when the model is already present (for example from OLLAMA_DATA).
    entrypoint: ["sh", "-c", "ollama list | grep -q 'qwen2.5:7b' || ollama pull qwen2.5:7b"]
    restart: "no"

  api:
    build: .
    depends_on:
      model:
        condition: service_completed_successfully
    environment:
      OLLAMA_HOST: http://ollama:11434
      CONTENT_AGENT_MODEL: qwen2.5:7b
      CONTENT_AGENT_ACTOR: web-ui
    volumes:
      - data:/data
    restart: unless-stopped

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  ollama:
  data:
