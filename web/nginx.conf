server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS. Looking up "api" per request means nginx starts even before the API is up.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:8000;

    # The API runs as the "api" service in docker-compose.yml.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # Single-page app: unknown paths return index.html.
    location / {
        try_files $uri /index.html;
    }
}
